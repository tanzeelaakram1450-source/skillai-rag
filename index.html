
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal AI Assistant</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .chat-container {
        width: 100%;
        max-width: 850px;
        height: 700px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Header */
    .chat-header {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        padding: 20px 25px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .ai-icon {
        width: 50px;
        height: 50px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
    }

    .header-text h2 {
        font-size: 20px;
        margin-bottom: 4px;
    }

    .header-text p {
        font-size: 13px;
        opacity: 0.85;
    }

    /* Chat area */
    .chat-box {
        flex: 1;
        padding: 25px;
        overflow-y: auto;
        background: #f8fafc;
    }

    .message {
        display: flex;
        margin-bottom: 18px;
    }

    .message.user {
        justify-content: flex-end;
    }

    .message.ai {
        justify-content: flex-start;
    }

    .bubble {
        max-width: 75%;
        padding: 13px 17px;
        border-radius: 16px;
        line-height: 1.5;
        font-size: 15px;
        word-wrap: break-word;
    }

    .user .bubble {
        background: #4f46e5;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .ai .bubble {
        background: white;
        color: #1f2937;
        border: 1px solid #e5e7eb;
        border-bottom-left-radius: 4px;
    }

    /* Input area */
    .input-area {
        padding: 18px;
        background: white;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 12px;
    }

    #userInput {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 15px;
        outline: none;
        resize: none;
        min-height: 50px;
        max-height: 120px;
    }

    #userInput:focus {
        border-color: #4f46e5;
    }

    #sendBtn {
        width: 55px;
        height: 50px;
        border: none;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-size: 20px;
        cursor: pointer;
        transition: 0.2s;
    }

    #sendBtn:hover {
        background: #4338ca;
    }

    #sendBtn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    /* Loading */
    .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
    }

    .typing span {
        width: 7px;
        height: 7px;
        background: #6b7280;
        border-radius: 50%;
        animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% {
            transform: translateY(0);
        }

        30% {
            transform: translateY(-5px);
        }
    }

    /* Mobile */
    @media (max-width: 600px) {

        body {
            padding: 0;
        }

        .chat-container {
            height: 100vh;
            border-radius: 0;
        }

        .bubble {
            max-width: 85%;
        }

        .chat-header {
            padding: 16px;
        }

        .chat-box {
            padding: 15px;
        }
    }
</style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">

        <div class="ai-icon">
            🤖
        </div>

        <div class="header-text">
            <h2>Personal AI Assistant</h2>
            <p>Ask me anything</p>
        </div>

    </div>


    <!-- Chat Messages -->
    <div class="chat-box" id="chatBox">

        <div class="message ai">

            <div class="bubble">
                Hello! 👋 I'm your personal AI assistant. How can I help you today?
            </div>

        </div>

    </div>


    <!-- Input -->
    <div class="input-area">

        <textarea
            id="userInput"
            placeholder="Type your message here..."
            rows="1"></textarea>

        <button id="sendBtn">
            ➤
        </button>

    </div>

</div>


<script>

    /*
    =====================================================
    IMPORTANT
    =====================================================

    Replace this URL with your n8n WEBHOOK URL.

    Example:

    const WEBHOOK_URL =
    "https://your-n8n-domain.com/webhook/personal-ai";

    =====================================================
    */

    const WEBHOOK_URL = "  https://tanzeela134.app.n8n.cloud/webhook/067e8cca-7aa7-48d2-976c-8fd7fef86474";


    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");


    // Add message to chat
    function addMessage(message, sender) {

        const messageDiv = document.createElement("div");

        messageDiv.className = "message " + sender;

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        // Preserve line breaks
        bubble.innerHTML = message
            .replace(/\n/g, "<br>");

        messageDiv.appendChild(bubble);

        chatBox.appendChild(messageDiv);

        // Scroll to bottom
        chatBox.scrollTop = chatBox.scrollHeight;
    }


    // Loading message
    function addLoadingMessage() {

        const messageDiv = document.createElement("div");

        messageDiv.className = "message ai";

        messageDiv.id = "loadingMessage";

        messageDiv.innerHTML = `
            <div class="bubble">
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;

        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
    }


    // Remove loading message
    function removeLoadingMessage() {

        const loadingMessage =
            document.getElementById("loadingMessage");

        if (loadingMessage) {
            loadingMessage.remove();
        }
    }


    // Send message
    async function sendMessage() {

        const message = userInput.value.trim();

        if (!message) {
            return;
        }


        // Show user's message
        addMessage(message, "user");


        // Clear input
        userInput.value = "";


        // Disable button
        sendBtn.disabled = true;


        // Show loading
        addLoadingMessage();


        try {

            const response = await fetch(WEBHOOK_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    message: message

                })

            });


            if (!response.ok) {

                throw new Error(
                    "Server returned an error: " +
                    response.status
                );

            }


            const data = await response.json();


            removeLoadingMessage();


            /*
            =================================================
            AI RESPONSE

            Expected n8n response:

            {
                "response": "Hello! How can I help?"
            }

            =================================================
            */

            const aiResponse =
                data.response ||
                data.output ||
                data.text ||
                data.message ||
                "Sorry, I could not understand the response from n8n.";


            addMessage(aiResponse, "ai");


        } catch (error) {

            console.error(error);

            removeLoadingMessage();

            addMessage(
                "Sorry, something went wrong. Please check your n8n webhook connection.",
                "ai"
            );

        }


        // Enable button
        sendBtn.disabled = false;


        // Focus input
        userInput.focus();

    }


    // Send button
    sendBtn.addEventListener("click", sendMessage);


    // Enter key
    userInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();

        }

    });

</script>

</body>
</html>
